<!DOCTYPE html>
<html lang="zh-Hant" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14101f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest?v=28" />
    <title>勇者放置記 — Brave Idle</title>
    <link rel="stylesheet" href="assets/style.css?v=28" />
  </head>
  <body>
    <div id="app">
      <!-- 遊戲畫面 + HUD -->
      <div id="game-wrap">
        <canvas id="game-canvas"></canvas>
        <div id="hud">
          <div class="hud-row">
            <div class="hud-chip stage">關卡 <b id="stage-val">1</b> <span id="region-val" class="region"></span></div>
            <button id="speed-btn" class="hud-chip btn">1×</button>
          </div>
          <div class="hud-row">
            <div class="hud-chip"><span class="ci" id="ic-gold"></span><b id="gold-val">0</b></div>
            <div class="hud-chip"><span class="ci" id="ic-gem"></span><b id="gem-val">0</b></div>
            <div class="hud-chip"><span class="ci" id="ic-soul"></span><b id="soul-val">0</b></div>
            <div class="hud-chip"><span class="ci" id="ic-power"></span><b id="power-val">0</b></div>
          </div>
        </div>
      </div>

      <!-- 下方面板 -->
      <div id="panel-area">
        <div id="tab-bar" class="tab-bar"></div>
        <div id="panel-content" class="panel-content"></div>
      </div>
    </div>

    <!-- Modal -->
    <div id="modal-layer" class="modal-layer hidden">
      <div id="modal-content" class="modal-content"></div>
    </div>

    <!-- 離線收益 -->
    <div id="offline-modal" class="modal-layer hidden">
      <div class="modal-content">
        <div class="modal-title">歡迎回來！</div>
        <p id="offline-text"></p>
        <button id="offline-close" class="primary-btn">領取</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script src="src/data.js?v=28"></script>
    <script src="src/sprites.js?v=28"></script>
    <script src="src/icons.js?v=28"></script>
    <script src="src/systems.js?v=28"></script>
    <script src="src/save.js?v=28"></script>
    <script src="src/render.js?v=28"></script>
    <script src="src/game.js?v=28"></script>
    <script src="src/ui.js?v=28"></script>
    <script src="src/main.js?v=28"></script>
  </body>
</html>
