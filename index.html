<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>勇者放置記 — Brave Idle</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 遊戲畫面區 -->
      <div id="game-wrap">
        <canvas id="game-canvas"></canvas>
        <!-- HUD 疊層 -->
        <div id="hud">
          <div class="hud-top">
            <div class="hud-chip">關卡 <b id="stage-val">1</b></div>
            <div class="hud-chip">💰 <b id="gold-val">0</b></div>
            <div class="hud-chip">戰力 <b id="power-val">0</b></div>
            <div class="hud-chip">Lv <b id="level-val">1</b></div>
          </div>
          <div class="bar-wrap">
            <div class="bar hp">
              <div id="hp-fill" class="bar-fill"></div>
              <span id="hp-text" class="bar-text">0 / 0</span>
            </div>
            <div class="bar xp">
              <div id="xp-fill" class="bar-fill"></div>
              <span id="xp-text" class="bar-text">Lv.1</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 下方面板 -->
      <div id="panel-area">
        <div class="tabs">
          <button class="tab-btn active" data-tab="equip">⚔️ 裝備</button>
          <button class="tab-btn" data-tab="skill">🔥 技能</button>
          <button class="tab-btn" data-tab="stats">📊 數據</button>
          <button class="tab-btn" data-tab="more">➕ 更多</button>
        </div>
        <div class="panels">
          <div id="panel-equip" class="panel active"></div>
          <div id="panel-skill" class="panel"></div>
          <div id="panel-stats" class="panel"></div>
          <div id="panel-more" class="panel">
            <div class="coming">
              <p>🧑‍🤝‍🧑 隊友系統 — 即將推出</p>
              <p>🐾 寵物系統 — 即將推出</p>
            </div>
            <button id="reset-btn" class="danger-btn">🗑️ 重置進度</button>
            <p class="hint">進度自動儲存於這台裝置的 Chrome。換手機或清除瀏覽資料會遺失存檔。</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 離線收益 -->
    <div id="offline-modal" class="modal hidden">
      <div class="modal-box">
        <h2>歡迎回來！</h2>
        <p id="offline-text"></p>
        <button id="offline-close" class="primary-btn">領取</button>
      </div>
    </div>

    <script src="src/data.js"></script>
    <script src="src/save.js"></script>
    <script src="src/render.js"></script>
    <script src="src/game.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
